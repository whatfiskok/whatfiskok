<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부위별 치수선 샘플 v2 (화살표+부위명)</title>
<style>
  :root{ --orange:#e8632a; --sub:#8a99a3; }
  body{ margin:0; padding:28px; background:#0f2027;
        font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
        display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
  .card{ width:230px; background:#f4f8fb; border-radius:14px; padding:16px 14px 14px;
         text-align:center; box-shadow:0 4px 14px rgba(0,0,0,0.3); }
  .stage{ position:relative; width:180px; height:130px; margin:4px auto 6px; }
  .stage img{ position:absolute; left:0; top:0; width:100%; height:100%; object-fit:contain; }
  .stage svg{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; }
  .dim line{ stroke:var(--orange); stroke-width:1.8; }
  .dim text{ fill:var(--orange); font-weight:800; }
  .dim .part{ font-size:11px; }
  .dim .size{ font-size:15px; }
  .cap{ color:var(--sub); font-size:0.8rem; }
  .label{ color:#cddbe4; font-size:0.72rem; margin-top:6px; }
</style>
</head>
<body>
<div id="cards"></div>
<svg width="0" height="0">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e8632a"/>
    </marker>
  </defs>
</svg>
<script>
const ICON_BASE = '/data/';
const ICON_FILE = { crab:'fish-icon-crab.png', shrimp:'fish-icon-shrimp.png' };

// dir:'h'/'v', a~b: 구간(%), pos: 반대축 위치(%)
const DIM = {
  crab:   { dir:'v', a:28, b:74, pos:78 },   // 게: 등딱지 앞뒤(세로)
  shrimp: { dir:'h', a:14, b:44, pos:26 },   // 새우: 머리쪽(가로)
};

const samples = [
  { name:"꽃게", icon:"crab",   size:6.4, unit:"cm", note:"두흉갑장" },
  { name:"대하", icon:"shrimp", size:8,   unit:"cm", note:"두흉갑장" },
];

function dimSvg(f){
  const d = DIM[f.icon]; if(!d) return '';
  const size = f.size + f.unit;
  if(d.dir === 'h'){
    const y = d.pos, mid = (d.a+d.b)/2;
    return `<line x1="${d.a}%" y1="${y}%" x2="${d.b}%" y2="${y}%" marker-start="url(#arw)" marker-end="url(#arw)"/>
      <text class="part" x="${mid}%" y="${y-9}%" text-anchor="middle">${f.note}</text>
      <text class="size" x="${mid}%" y="${y+16}%" text-anchor="middle">${size}</text>`;
  } else {
    const x = d.pos, mid = (d.a+d.b)/2;
    return `<line x1="${x}%" y1="${d.a}%" x2="${x}%" y2="${d.b}%" marker-start="url(#arw)" marker-end="url(#arw)"/>
      <text class="part" x="${x+4}%" y="${mid}%" dominant-baseline="middle">${f.note}</text>
      <text class="size" x="${x+4}%" y="${mid+8}%" dominant-baseline="middle">${size}</text>`;
  }
}
function card(f){
  const src = ICON_BASE + (ICON_FILE[f.icon] || '');
  return `
  <div>
    <div class="card">
      <div class="stage">
        <img src="${src}" alt="${f.name}">
        <svg class="dim" viewBox="0 0 100 100" preserveAspectRatio="none">${dimSvg(f)}</svg>
      </div>
      <div class="cap">${f.note} ${f.size}${f.unit} 이하 포획금지</div>
    </div>
    <div class="label">${f.name} (${f.icon})</div>
  </div>`;
}
document.getElementById('cards').innerHTML = samples.map(card).join('');
</script>
</body>
</html>
