<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부위별 치수선 샘플</title>
<style>
  :root{ --orange:#e8632a; --ink:#1a3b4d; --sub:#8a99a3; }
  body{ margin:0; padding:28px; background:#0f2027;
        font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
        display:flex; flex-wrap:wrap; gap:18px; justify-content:center; }
  .card{ width:220px; background:#f4f8fb; border-radius:14px; padding:16px 14px 14px;
         text-align:center; box-shadow:0 4px 14px rgba(0,0,0,0.3); }
  .stage{ position:relative; width:170px; height:120px; margin:4px auto 6px; }
  .stage img{ position:absolute; left:0; top:0; width:100%; height:100%; object-fit:contain; }
  .stage svg{ position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible; }
  .dim line{ stroke:var(--orange); stroke-width:2; }
  .dim text{ fill:var(--orange); font-size:15px; font-weight:800; }
  .cap{ color:var(--sub); font-size:0.8rem; }
  .label{ color:#cddbe4; font-size:0.72rem; margin-top:6px; }
</style>
</head>
<body>
<div id="cards"></div>
<script>
const ICON_BASE = '/data/';
const ICON_FILE = {
  fish:'fish-icon-fish.png', hairtail:'fish-icon-hairtail.png',
  crab:'fish-icon-crab.png', squid:'fish-icon-squid.png',
};

// 아이콘 종류별로 "치수선을 그을 구간"을 백분율로 한 번만 정의 (핵심!)
//  dir: 'h'=가로선, 'v'=세로선 / a~b: 시작·끝 백분율 / pos: 선을 놓을 반대축 위치(%)
const DIM = {
  fish:     { dir:'h', a:8,  b:92, pos:12 },   // 전장: 전체 가로
  hairtail: { dir:'h', a:8,  b:40, pos:20 },   // 항문장: 앞쪽 일부만
  crab:     { dir:'h', a:22, b:78, pos:22 },   // 두흉갑장: 등딱지 가로
  squid:    { dir:'v', a:10, b:60, pos:30 },   // 외투장: 몸통 세로
};

const samples = [
  { name:"감성돔",  icon:"fish",     size:25,  unit:"cm", note:"전장" },
  { name:"갈치",    icon:"hairtail", size:18,  unit:"cm", note:"항문장" },
  { name:"꽃게",    icon:"crab",     size:6.4, unit:"cm", note:"두흉갑장" },
  { name:"살오징어",icon:"squid",    size:15,  unit:"cm", note:"외투장" },
];

function dimSvg(f){
  const d = DIM[f.icon]; if(!d) return '';
  const cap = f.size + f.unit;
  if(d.dir === 'h'){
    const y = d.pos;
    return `<line x1="${d.a}%" y1="${y}%" x2="${d.b}%" y2="${y}%"/>
      <line x1="${d.a}%" y1="${y-4}%" x2="${d.a}%" y2="${y+4}%"/>
      <line x1="${d.b}%" y1="${y-4}%" x2="${d.b}%" y2="${y+4}%"/>
      <text x="${(d.a+d.b)/2}%" y="${y-6}%" text-anchor="middle">${cap}</text>`;
  } else {
    const x = d.pos;
    return `<line x1="${x}%" y1="${d.a}%" x2="${x}%" y2="${d.b}%"/>
      <line x1="${x-4}%" y1="${d.a}%" x2="${x+4}%" y2="${d.a}%"/>
      <line x1="${x-4}%" y1="${d.b}%" x2="${x+4}%" y2="${d.b}%"/>
      <text x="${x+6}%" y="${(d.a+d.b)/2}%" dominant-baseline="middle">${cap}</text>`;
  }
}
function card(f){
  const src = ICON_BASE + (ICON_FILE[f.icon] || ICON_FILE.fish);
  return `
  <div>
    <div class="card">
      <div class="stage">
        <img src="${src}" alt="${f.name}">
        <svg class="dim" viewBox="0 0 100 100" preserveAspectRatio="none">${dimSvg(f)}</svg>
      </div>
      <div class="cap">${f.note} ${f.size}${f.unit} 이하 포획금지</div>
    </div>
    <div class="label">${f.name} (${f.icon})</div>
  </div>`;
}
document.getElementById('cards').innerHTML = samples.map(card).join('');
</script>
</body>
</html>
